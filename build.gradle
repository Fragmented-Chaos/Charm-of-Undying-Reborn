plugins {
    // Provides the assemble/build lifecycle tasks so universalJar can be wired into them
    id 'base'
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

version = mod_version

// ---------------------------------------------------------------------------------------------
// Universal jar: one artifact that loads on both Fabric and NeoForge.
//
// The NeoForge jar already contains every shared (`common`) class, so it is used as the base; the
// Fabric jar only contributes the files that do not exist there (fabric.mod.json and the Fabric-only
// implementations). Duplicates keep the NeoForge copy, which is why that tree is added first.
// ---------------------------------------------------------------------------------------------
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Packs both loaders into a single universal jar'

    dependsOn ':fabric:jar', ':neoforge:jar'
    archiveFileName = "${mod_id}-${mod_version}-universal.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // META-INF/services is deliberately dropped: the loader entry points install their services
    // directly (see CharmSlotServices), so a merged jar must not carry either side's service file.
    from({ zipTree(project(':neoforge').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/services/**'
    }
    from({ zipTree(project(':fabric').tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/services/**'
    }

    manifest {
        attributes(
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : archiveVersion.get(),
                'Implementation-Title'  : "${mod_id}-universal",
                'Implementation-Version': archiveVersion.get(),
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        )
    }
}

tasks.named('assemble') {
    dependsOn 'universalJar'
}

// Collect both platform JARs into a single distribution zip
tasks.register('distZip', Zip) {
    group = 'distribution'
    description = 'Packs Fabric and NeoForge JARs into one zip for distribution'
    archiveFileName = "${mod_id}-${mod_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    from(project(':fabric').tasks.named('jar')) {
        into 'fabric'
    }
    from(project(':neoforge').tasks.named('jar')) {
        into 'neoforge'
    }
    from(tasks.named('universalJar')) {
        into 'universal'
    }
}