modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL="https://github.com/Fragmented-Chaos/Charm-of-Undying-Reborn/issues"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL="https://github.com/Fragmented-Chaos/Charm-of-Undying-Reborn"
logoFile="assets/${mod_id}/${mod_id}.png"
credits="${credits}"
authors = "${mod_authors}"
description = '''${description}'''
[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
# Accessory slot provider. Curios and Trinkets Updated are both optional: NeoForge cannot express
# "one of", so the provider is picked at runtime (see neoforge/NeoForgeCharmSlotHelper).
modId = "curios"
type="optional"
versionRange = "[${curios_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "trinkets_updated"
type="optional"
versionRange = "[${trinkets_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "${mod_id}.mixins.json"
